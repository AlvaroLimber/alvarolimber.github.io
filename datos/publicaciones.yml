- title: 'Aproximación del impacto del programa de saneamiento de tierras en Bolivia:
    BO-L1113'
  authors: Chirino, A.
  year: 2024
  venue: Revista ARU SEARCH, Vol. 4
  categories:
  - Artículo
  pdf: papers/ARU_SEARCH_4-12-45.pdf
  url: https://www.aru.org.bo/journalaru/index.php/arusearch/article/view/33
  abstract: El estudio analiza el impacto del Programa de Saneamiento y Titulación
    de Tierras en Bolivia BO-L1113 que inició el 2016, motivado por la importancia
    de la seguridad jurídica en el desarrollo productivo y social. Se emplea el método
    de emparejamiento para evaluar el programa, utilizando unidades productivas familiares
    con y sin titulación como tratamiento y control, con datos de la encuesta de línea
    base recolectada entre abril y junio de 2023. Los resultados muestran un efecto
    positivo y estadísticamente significativo en la inversión productiva, el valor
    bruto de producción y los ingresos netos per cápita de las unidades productivas
    familiares.
  key: chirino2024tierras
  bibtex: |-
    @article{chirino2024tierras,
      author   = {Chirino, Alvaro},
      title    = {Aproximación del impacto del programa de saneamiento de tierras en Bolivia: BO-L1113},
      journal  = {Revista ARU SEARCH},
      volume   = {4},
      year     = {2024},
      keywords = {Artículo},
      file     = {ARU_SEARCH_4-12-45.pdf},
      url      = {https://www.aru.org.bo/journalaru/index.php/arusearch/article/view/33},
      abstract = {El estudio analiza el impacto del Programa de Saneamiento y Titulación de Tierras en Bolivia BO-L1113 que inició el 2016, motivado por la importancia de la seguridad jurídica en el desarrollo productivo y social. Se emplea el método de emparejamiento para evaluar el programa, utilizando unidades productivas familiares con y sin titulación como tratamiento y control, con datos de la encuesta de línea base recolectada entre abril y junio de 2023. Los resultados muestran un efecto positivo y estadísticamente significativo en la inversión productiva, el valor bruto de producción y los ingresos netos per cápita de las unidades productivas familiares.}
    }
- title: Currícula estadística en Bolivia, cambios en la era del big data
  authors: Chirino, A.
  year: 2022
  venue: Proceedings of the 11th International Conference on Teaching Statistics (ICOTS11),
    Invited Paper
  categories:
  - Memorias de congreso
  pdf: papers/ICOTS11_249_CHIRINOG.pdf
  url: https://iase-web.org/icots/11/proceedings/pdfs/ICOTS11_249_CHIRINOG.pdf
  abstract: El presente documento presenta el desarrollo de la currícula estadística
    en el sistema escolar y universitario en Bolivia, se realiza una revisión de la
    normativa vigente y se describen los contenidos vinculados a la estadística en
    el ciclo primario y secundario. Para el pregrado se describe el proceso del último
    plan de estudios en la Universidad Mayor de San Andrés y se incluye el perfil
    estadístico descrito mediante entrevistas a los directores de carrera de las dos
    únicas universidades que ofrecen el programa en estadística.
