- title: 2 Census, 10 years of household surveys in Bolivia. Time to re-weight and
    define a comparable sample design for welfare indicators
  authors: Chirino, A.
  year: 2015
  venue: Proceedings of the 60th World Statistics Congress of the International Statistical
    Institute, Río de Janeiro
  categories:
  - Memorias de congreso
  pdf: papers/CPS077-P1-S.pdf
  url: https://isi-web.org/sites/default/files/import/files-2015/CPS077-P1-S.pdf
  abstract: This paper proposes a sample design for the 2002–2012 period of the household
    survey series conducted by the National Institute of Statistics of Bolivia, aimed
    at optimal performance for moderate and extreme poverty indicators at departmental
    and national levels. Existing designs differ in stratification, clustering, sampling
    frame, allocation and sample size, hindering consistent interpretation of welfare
    trends; and the 2012 Census revealed a population structure different from previous
    projections, making it an ideal moment to reweight the sample.
  key: chirino2015census
